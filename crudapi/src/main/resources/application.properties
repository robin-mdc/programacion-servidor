spring.application.name=crudapi

# antes: jdbc:mysql://localhost:3306/tienda
# motivo: crea la bd tienda automáticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/tienda?createDatabaseIfNotExist=true
spring.datasource.username=root
# antes: root
# motivo: el usuario root de xampp no tiene contraseña por defecto
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
