spring.application.name=crudapi

# antes: no se cargaba ningún fichero externo
# motivo: lee las credenciales de crudapi/.env (no se sube a git) si existe
spring.config.import=optional:file:.env[.properties]

# antes: url, usuario y contraseña escritos directamente aquí
# motivo: las credenciales no deben subirse a git, se leen de variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# antes: open-in-view activado por defecto (avisaba en el log)
# motivo: las consultas se hacen en el service con @Transactional, no hace falta mantener la sesión abierta en la vista
spring.jpa.open-in-view=false
