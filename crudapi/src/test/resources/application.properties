# antes: los tests usaban el application.properties principal (mysql)
# motivo: con h2 (bd en memoria) los tests funcionan sin tener mysql arrancado
spring.datasource.url=jdbc:h2:mem:tienda;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
